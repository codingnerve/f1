<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1015"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>

    <!-- Racing Red Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A12"/>
      <stop offset="100%" stop-color="#C00400"/>
    </linearGradient>

    <!-- Red Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#E10600" flood-opacity="0.35"/>
    </filter>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Subtle Carbon Pattern -->
    <pattern id="carbon" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#08090B"/>
      <rect x="0" y="0" width="8" height="8" fill="#0c0d12"/>
      <rect x="8" y="8" width="8" height="8" fill="#0c0d12"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="64" fill="url(#bgGrad)"/>
  <rect width="1024" height="1024" rx="64" fill="url(#carbon)" opacity="0.45"/>

  <!-- Border Accent -->
  <rect x="16" y="16" width="992" height="992" rx="52" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.08"/>

  <!-- Center Group -->
  <g transform="translate(512, 420)">
    <!-- Speed streak lines behind the badge -->
    <path d="M 140 -50 L 250 -50" stroke="#E10600" stroke-width="8" stroke-linecap="round" opacity="0.65"/>
    <path d="M 120 -20 L 280 -20" stroke="#E10600" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
    <path d="M 100 10 L 260 10" stroke="#E10600" stroke-width="10" stroke-linecap="round" opacity="0.75"/>
    <path d="M 80 40 L 230 40" stroke="#E10600" stroke-width="6" stroke-linecap="round" opacity="0.5"/>

    <!-- Slanted Red Badge (Parallelogram) -->
    <g filter="url(#glow)">
      <polygon points="-120,130 60,130 150,-130 -30,-130" fill="url(#redGrad)"/>
    </g>

    <!-- Numeral 2 inside badge -->
    <!-- Hand-crafted racing 2 with speed cutouts -->
    <g filter="url(#shadow)" fill="#FFFFFF">
      <path d="M -15,-65 C 5,-85 35,-85 55,-65 C 72,-48 68,-25 45,-2 L -18,55 L 75,55 L 70,80 L -65,80 L -60,50 L 15,-20 C 35,-38 38,-48 30,-58 C 22,-68 5,-68 -10,-55 Z"/>
    </g>
  </g>

  <!-- Typography: WAY 2 TICKETS -->
  <g transform="translate(512, 690)" text-anchor="middle">
    <!-- WAY -->
    <text x="-165" y="0" font-family="'Outfit', 'Inter', 'Segoe UI', system-ui, sans-serif" font-size="76" font-weight="900" fill="#FFFFFF" letter-spacing="4">WAY</text>

    <!-- Slanted Red 2 Box -->
    <g transform="translate(-10, -52)">
      <polygon points="-24,60 18,60 38,-16 -4,-16" fill="#E10600"/>
      <text x="7" y="44" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" text-anchor="middle">2</text>
    </g>

    <!-- TICKETS -->
    <text x="175" y="0" font-family="'Outfit', 'Inter', 'Segoe UI', system-ui, sans-serif" font-size="76" font-weight="900" fill="#FFFFFF" letter-spacing="4">TICKETS</text>
  </g>

  <!-- Subtitle -->
  <text x="512" y="760" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="600" fill="#FFFFFF" opacity="0.65" letter-spacing="12" text-anchor="middle">
    FORMULA 1 BOOKING
  </text>

  <!-- Bottom Accent Stripe -->
  <rect x="432" y="810" width="160" height="4" rx="2" fill="#E10600"/>
</svg>
