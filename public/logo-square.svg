<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1015"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>

    <!-- Racing Red Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A12"/>
      <stop offset="100%" stop-color="#C00400"/>
    </linearGradient>

    <!-- Red Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#E10600" flood-opacity="0.3"/>
    </filter>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="48" fill="url(#bgGrad)"/>

  <!-- Centered Emblem (Red Slanted Badge with 2) -->
  <g transform="translate(512, 430)">
    <!-- Slanted Red Badge (Parallelogram) -->
    <g filter="url(#glow)">
      <polygon points="-140,150 70,150 175,-150 -35,-150" fill="url(#redGrad)"/>
    </g>

    <!-- Numeral 2 inside badge -->
    <g filter="url(#shadow)" fill="#FFFFFF">
      <path d="M -18,-75 C 6,-98 42,-98 66,-75 C 86,-55 81,-28 54,-2 L -20,62 L 90,62 L 84,92 L -75,92 L -69,57 L 18,-24 C 42,-44 45,-56 35,-68 C 26,-79 6,-79 -12,-64 Z"/>
    </g>
  </g>

  <!-- Clean Typography: WAY2TICKETS -->
  <g transform="translate(512, 730)" text-anchor="middle">
    <!-- WAY -->
    <text x="-195" y="0" font-family="'Outfit', 'Inter', 'Segoe UI', system-ui, sans-serif" font-size="92" font-weight="900" fill="#FFFFFF" letter-spacing="3">WAY</text>

    <!-- Slanted Red 2 Box -->
    <g transform="translate(-12, -62)">
      <polygon points="-28,72 22,72 46,-18 -4,-18" fill="#E10600"/>
      <text x="9" y="53" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-size="62" font-weight="900" fill="#FFFFFF" text-anchor="middle">2</text>
    </g>

    <!-- TICKETS -->
    <text x="205" y="0" font-family="'Outfit', 'Inter', 'Segoe UI', system-ui, sans-serif" font-size="92" font-weight="900" fill="#FFFFFF" letter-spacing="3">TICKETS</text>
  </g>
</svg>
